name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  geometry:
    name: geometry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: for file in *.mjs; do node --check "$file"; done
      - run: npm test
